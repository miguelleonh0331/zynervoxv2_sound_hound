[zynervoxv2-pruebas-contestada]
; Sin __ZV2_XFER_TRUNK y __ZV2_XFER_DEST solo detecta: AMD 8 s, registra, espera 3 s y cuelga. Con ambos, el AMD solo corre si __ZV2_AMD=1 y la acción (__ZV2_AMD_ACTION_<causa|estado>: transfer, hangup o retry) decide; sin variable, HUMAN y NOTSURE transfieren y MACHINE cuelga.
exten => s,1,Set(AGISIGHUP=no)
 same => n,Set(DB(zv2c/${ZV2_KEY}/ANSWERED)=1)
 same => n,Set(ZV2_REC=/var/lib/zynervoxv2/asterisk/recordings/marcador/${ZV2_KEY}.wav)
 same => n,Set(ZV2_REC_C=/var/lib/zynervoxv2/asterisk/recordings/marcador/${ZV2_KEY}.contacto.wav)
 same => n,MixMonitor(${ZV2_REC},r(${ZV2_REC_C}))
 same => n,Set(DB(zv2c/${ZV2_KEY}/REC_PATH)=${ZV2_REC})
 same => n,Set(DB(zv2c/${ZV2_KEY}/REC_C_PATH)=${ZV2_REC_C})
 same => n,Set(DB(zv2c/${ZV2_KEY}/STAGE)=AMD)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,event,${ZV2_CALL_ID},ANSWER)
 same => n,GotoIf($["${ZV2_XFER_TRUNK}" = "" | "${ZV2_XFER_DEST}" = ""]?amd)
 same => n,GotoIf($["${ZV2_AMD}" != "1"]?xfer)
 same => n(amd),Gosub(zynervoxv2-amd-params,s,1)
 same => n,Set(ZV2_T1=${FILTER(0-9,${SHELL(date +%s%3N)})})
 same => n,AMD(${ZV2_AMDP1},${ZV2_AMDP2},${ZV2_AMDP3},${ZV2_AMDP4},${ZV2_AMDP5},${ZV2_AMDP6},${ZV2_AMDP7},${ZV2_AMDP8},${ZV2_AMDP9})
 same => n,Set(ZV2_T2=${FILTER(0-9,${SHELL(date +%s%3N)})})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_MS)=${MATH(${ZV2_T2}-${ZV2_T1},int)})
 same => n,Set(ZV2_AMDCAUSA=${CUT(AMDCAUSE,-,1)})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_STATUS)=${AMDSTATUS})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_CAUSE)=${ZV2_AMDCAUSA})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_RAW)=${AMDCAUSE})
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,event,${ZV2_CALL_ID},AMD,${AMDSTATUS},${ZV2_AMDCAUSA})
 same => n,GotoIf($["${ZV2_XFER_TRUNK}" = "" | "${ZV2_XFER_DEST}" = ""]?espera)
 same => n,Set(ZV2_ACC=)
 same => n,ExecIf($["${ZV2_AMDCAUSA}" != ""]?Set(ZV2_ACC=${ZV2_AMD_ACTION_${ZV2_AMDCAUSA}}))
 same => n,GotoIf($["${ZV2_ACC}" != ""]?acc)
 same => n,Set(ZV2_ACC=${ZV2_AMD_ACTION_${AMDSTATUS}})
 same => n,GotoIf($["${ZV2_ACC}" != ""]?acc)
 same => n,Set(ZV2_ACC=${IF($["${AMDSTATUS}" = "MACHINE"]?hangup:transfer)})
 same => n(acc),GotoIf($["${ZV2_ACC}" = "transfer"]?xfer)
 same => n,GotoIf($["${ZV2_ACC}" = "retry"]?aretry)
 same => n,Goto(ahang)
 same => n(xfer),Set(DB(zv2c/${ZV2_KEY}/STAGE)=XFER)
 same => n,ExecIf($["${ZV2_XFER_TIMEOUT}" = ""]?Set(ZV2_XFER_TIMEOUT=45))
 same => n,Set(CALLERID(num)=${ZV2_XFER_DEST})
 same => n,Dial(SIP/${ZV2_XFER_TRUNK}/${ZV2_XFER_DEST},${ZV2_XFER_TIMEOUT},b(zynervoxv2-forward-headers^s^1)U(zynervoxv2-xfer-contestada)g)
 same => n,Set(DB(zv2c/${ZV2_KEY}/XFER_STATUS)=${DIALSTATUS})
 same => n,Set(ZV2_XFER_Q=${HANGUPCAUSE})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?finxfer)
 same => n,Set(ZV2_XFER_KEYS=${HANGUPCAUSE_KEYS()})
 same => n,GotoIf($["${ZV2_XFER_KEYS}" = ""]?finxfer)
 same => n,Set(ZV2_XFER_KEY=${CUT(ZV2_XFER_KEYS,\,,${FIELDQTY(ZV2_XFER_KEYS,\,)})})
 same => n,Set(DB(zv2c/${ZV2_KEY}/XFER_SIP)=${HANGUPCAUSE(${ZV2_XFER_KEY},tech)})
 same => n,Set(DB(zv2c/${ZV2_KEY}/XFER_Q850)=${ZV2_XFER_Q})
 same => n(finxfer),Hangup()
 same => n(ahang),Set(DB(zv2c/${ZV2_KEY}/STAGE)=AMD_HANGUP)
 same => n,Hangup()
 same => n(aretry),Set(DB(zv2c/${ZV2_KEY}/STAGE)=AMD_RETRY)
 same => n,Hangup()
 same => n(espera),Set(DB(zv2c/${ZV2_KEY}/STAGE)=ESPERA)
 same => n,Wait(3)
 same => n,Set(DB(zv2c/${ZV2_KEY}/STAGE)=FIN_PRUEBA)
 same => n,Hangup()

