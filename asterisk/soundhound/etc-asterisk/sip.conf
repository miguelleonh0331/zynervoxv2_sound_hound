[general]
;localnet=192.168.3.0/255.255.255.0
;externip=190.223.57.74
;nat=force_rport,comedia

context=zynervoxv2
udpbindaddr=0.0.0.0:5060
tcpenable=no
;tlsenable=no
allowguest=no
alwaysauthreject=yes
disallow=all
allow=ulaw
allow=alaw
directmedia=no
dtmfmode=rfc2833
sipdebug=no

; ===== TLS para SoundHound =====
tlsenable=yes
tlsbindaddr=0.0.0.0:5065
tlscertfile=/etc/asterisk/tls/voip.servex.com.pe-fullchain.pem
tlsprivatekey=/etc/asterisk/tls/voip.servex.com.pe.key
tlscafile=/etc/asterisk/tls/soundhound-ca-digicert.pem
tlsclientmethod=tlsv1_2

#include /var/lib/zynervoxv2/asterisk/modules/asterisk/sip-zynervoxv2.conf
#include /var/lib/zynervoxv2/asterisk/modules/asterisk/sip-zynervoxv2-annexos.conf


;######## SOUND HOUND (Pre-Prod) - TLS 5065 ########
[soundhound]
type=peer
host=usa1-dev-sbc01.sip.amelia.com
port=5065
transport=tls
encryption=yes
disallow=all
allow=ulaw
allow=alaw
context=from-soundhound
qualify=yes
directmedia=no
dtmfmode=rfc2833

;######## SOUND HOUND (PRODUCCION) - TLS 5065 - ACTIVAR DESPUES ########
;[soundhound]
;type=peer
;host=usa1-prod-sbc01.sip.amelia.com
;port=5065
;transport=tls
;encryption=yes
;disallow=all
;allow=ulaw
;allow=alaw
;context=from-soundhound
;qualify=yes
;directmedia=no
;dtmfmode=rfc2833
