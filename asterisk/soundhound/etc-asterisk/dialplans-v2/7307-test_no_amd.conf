; Test default: list 1; an explicit ZV2_LIST_ID takes precedence.
exten => _7307X.,1,NoOp(carsa_bot)
 same => n,ExecIf($["${ZV2_LIST_ID}" = ""]?Set(ZV2_LIST_ID=1))
 same => n,Set(__ZV2_LIST_ID=${ZV2_LIST_ID})
 same => n,Set(__ZV2_PHONE=${EXTEN:4})
 same => n,Set(__ZV2_CALL_ID=${UNIQUEID})
 same => n,Set(AGISIGHUP=no)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,start,${ZV2_LIST_ID},${ZV2_PHONE},${ZV2_CALL_ID},7307,carrier1,${CHANNEL(linkedid)})
 same => n,GotoIf($["${ZV2_TRACK_OK}" != "1"]?fallo)
 same => n,Set(__ZV2_LEAD_ID=${ZV2_LEAD_ID})
 same => n,GotoIf($["${ZV2_BLACKLIST}" != "SI"]?bl_libre)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,check,${ZV2_PHONE},${ZV2_CAMPAIGN_ID})
 same => n,GotoIf($["${ZV2_BLOQ}" = "NO"]?bl_libre)
 same => n,GotoIf($["${ZV2_BLOQ}" = "SI"]?bl_si)
 same => n,Log(WARNING,LISTA_NEGRA consulta fallida (ZV2_BLOQ=${ZV2_BLOQ}): no se llama id=${ZV2_CALL_ID})
 same => n,GotoIf($["${ZV2_CALL_ID}" = ""]?bl_fin)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,finish,${ZV2_CALL_ID},CHANUNAVAIL,,,,,,BLOQUEO_ERROR,DIAL)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,blocked,${ZV2_CALL_ID},ERROR)
 same => n,Goto(bl_fin)
 same => n(bl_si),Log(NOTICE,LISTA_NEGRA bloqueado id=${ZV2_CALL_ID})
 same => n,GotoIf($["${ZV2_CALL_ID}" = ""]?bl_fin)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,finish,${ZV2_CALL_ID},,,,,,,BLOQUEADO,DIAL)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,blocked,${ZV2_CALL_ID})
 same => n(bl_fin),Hangup()
 same => n(bl_libre),NoOp(lista negra: libre)
 same => n,Set(CHANNEL(hangup_handler_push)=zynervoxv2-call-finish,s,1)
 same => n,Dial(SIP/carrier1/883651${ZV2_PHONE},60,b(zynervoxv2-outbound^s^1)U(zynervoxv2-bot-ivr-sin-amd))
 same => n,Hangup()
 same => n(fallo),Hangup()
