exten => _7308X.,1,NoOp(marcador_pruebas)
 same => n,Set(__ZV2_PHONE=${EXTEN:4})
 same => n,Set(AGISIGHUP=no)
 same => n,GotoIf($["${ZV2_BLACKLIST}" != "SI"]?bl_libre)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,check,${ZV2_PHONE},${ZV2_CAMPAIGN_ID})
 same => n,GotoIf($["${ZV2_BLOQ}" = "NO"]?bl_libre)
 same => n,GotoIf($["${ZV2_BLOQ}" = "SI"]?bl_si)
 same => n,Log(WARNING,LISTA_NEGRA consulta fallida (ZV2_BLOQ=${ZV2_BLOQ}): no se llama id=${ZV2_CALL_ID})
 same => n,GotoIf($["${ZV2_CALL_ID}" = ""]?bl_fin)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,finish,${ZV2_CALL_ID},CHANUNAVAIL,,,,,,BLOQUEO_ERROR,DIAL)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,blocked,${ZV2_CALL_ID},ERROR)
 same => n,Goto(bl_fin)
 same => n(bl_si),Log(NOTICE,LISTA_NEGRA bloqueado id=${ZV2_CALL_ID})
 same => n,GotoIf($["${ZV2_CALL_ID}" = ""]?bl_fin)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,finish,${ZV2_CALL_ID},,,,,,,BLOQUEADO,DIAL)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,blocked,${ZV2_CALL_ID})
 same => n(bl_fin),Hangup()
 same => n(bl_libre),NoOp(lista negra: libre)
 same => n,Set(CHANNEL(hangup_handler_push)=zynervoxv2-pruebas-cierre,s,1)
 same => n,Set(ZV2_STAGE=DIAL)
 same => n,GotoIf($["${ZV2_CALL_ID}" = ""]?sinid)
 same => n,Set(__ZV2_KEY=${FILTER(0-9A-Za-z._-,${ZV2_CALL_ID})})
 same => n,ExecIf($["${ZV2_DIAL_TIMEOUT}" = ""]?Set(ZV2_DIAL_TIMEOUT=30))
 same => n,Dial(SIP/carrier1/883651${ZV2_PHONE},${ZV2_DIAL_TIMEOUT},b(zynervoxv2-outbound^s^1)U(zynervoxv2-pruebas-contestada))
 same => n,Hangup()
 same => n(sinid),Set(ZV2_STAGE=SIN_ID)
 same => n,Hangup()

[zynervoxv2-pruebas-contestada]
; Sin __ZV2_XFER_TRUNK y __ZV2_XFER_DEST solo detecta: AMD 8 s, registra, espera 3 s y cuelga. Con ambos, el AMD solo corre si __ZV2_AMD=1 y la acción (__ZV2_AMD_ACTION_<causa|estado>: transfer, hangup o retry) decide; sin variable, HUMAN y NOTSURE transfieren y MACHINE cuelga.
exten => s,1,Set(AGISIGHUP=no)
 same => n,Set(DB(zv2c/${ZV2_KEY}/ANSWERED)=1)
 same => n,Set(ZV2_REC=/var/lib/zynervoxv2/asterisk/recordings/marcador/${ZV2_KEY}.wav)
 same => n,Set(ZV2_REC_C=/var/lib/zynervoxv2/asterisk/recordings/marcador/${ZV2_KEY}.contacto.wav)
 same => n,MixMonitor(${ZV2_REC},r(${ZV2_REC_C}))
 same => n,Set(DB(zv2c/${ZV2_KEY}/REC_PATH)=${ZV2_REC})
 same => n,Set(DB(zv2c/${ZV2_KEY}/REC_C_PATH)=${ZV2_REC_C})
 same => n,Set(DB(zv2c/${ZV2_KEY}/STAGE)=AMD)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,event,${ZV2_CALL_ID},ANSWER)
 same => n,GotoIf($["${ZV2_XFER_TRUNK}" = "" | "${ZV2_XFER_DEST}" = ""]?amd)
 same => n,GotoIf($["${ZV2_AMD}" != "1"]?xfer)
 same => n(amd),Gosub(zynervoxv2-amd-params,s,1)
 same => n,Set(ZV2_T1=${FILTER(0-9,${SHELL(date +%s%3N)})})
 same => n,AMD(${ZV2_AMDP1},${ZV2_AMDP2},${ZV2_AMDP3},${ZV2_AMDP4},${ZV2_AMDP5},${ZV2_AMDP6},${ZV2_AMDP7},${ZV2_AMDP8},${ZV2_AMDP9})
 same => n,Set(ZV2_T2=${FILTER(0-9,${SHELL(date +%s%3N)})})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_MS)=${MATH(${ZV2_T2}-${ZV2_T1},int)})
 same => n,Set(ZV2_AMDCAUSA=${CUT(AMDCAUSE,-,1)})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_STATUS)=${AMDSTATUS})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_CAUSE)=${ZV2_AMDCAUSA})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_RAW)=${AMDCAUSE})
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,event,${ZV2_CALL_ID},AMD,${AMDSTATUS},${ZV2_AMDCAUSA})
 same => n,GotoIf($["${ZV2_XFER_TRUNK}" = "" | "${ZV2_XFER_DEST}" = ""]?espera)
 same => n,Set(ZV2_ACC=)
 same => n,ExecIf($["${ZV2_AMDCAUSA}" != ""]?Set(ZV2_ACC=${ZV2_AMD_ACTION_${ZV2_AMDCAUSA}}))
 same => n,GotoIf($["${ZV2_ACC}" != ""]?acc)
 same => n,Set(ZV2_ACC=${ZV2_AMD_ACTION_${AMDSTATUS}})
 same => n,GotoIf($["${ZV2_ACC}" != ""]?acc)
 same => n,Set(ZV2_ACC=${IF($["${AMDSTATUS}" = "MACHINE"]?hangup:transfer)})
 same => n(acc),GotoIf($["${ZV2_ACC}" = "transfer"]?xfer)
 same => n,GotoIf($["${ZV2_ACC}" = "retry"]?aretry)
 same => n,Goto(ahang)
 same => n(xfer),Set(DB(zv2c/${ZV2_KEY}/STAGE)=XFER)
 same => n,ExecIf($["${ZV2_XFER_TIMEOUT}" = ""]?Set(ZV2_XFER_TIMEOUT=45))
 same => n,Set(CALLERID(num)=${ZV2_XFER_DEST})
 same => n,Dial(SIP/${ZV2_XFER_TRUNK}/${ZV2_XFER_DEST},${ZV2_XFER_TIMEOUT},b(zynervoxv2-forward-headers^s^1)U(zynervoxv2-xfer-contestada)g)
 same => n,Set(DB(zv2c/${ZV2_KEY}/XFER_STATUS)=${DIALSTATUS})
 same => n,Set(ZV2_XFER_Q=${HANGUPCAUSE})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?finxfer)
 same => n,Set(ZV2_XFER_KEYS=${HANGUPCAUSE_KEYS()})
 same => n,GotoIf($["${ZV2_XFER_KEYS}" = ""]?finxfer)
 same => n,Set(ZV2_XFER_KEY=${CUT(ZV2_XFER_KEYS,\,,${FIELDQTY(ZV2_XFER_KEYS,\,)})})
 same => n,Set(DB(zv2c/${ZV2_KEY}/XFER_SIP)=${HANGUPCAUSE(${ZV2_XFER_KEY},tech)})
 same => n,Set(DB(zv2c/${ZV2_KEY}/XFER_Q850)=${ZV2_XFER_Q})
 same => n(finxfer),Hangup()
 same => n(ahang),Set(DB(zv2c/${ZV2_KEY}/STAGE)=AMD_HANGUP)
 same => n,Hangup()
 same => n(aretry),Set(DB(zv2c/${ZV2_KEY}/STAGE)=AMD_RETRY)
 same => n,Hangup()
 same => n(espera),Set(DB(zv2c/${ZV2_KEY}/STAGE)=ESPERA)
 same => n,Wait(3)
 same => n,Set(DB(zv2c/${ZV2_KEY}/STAGE)=FIN_PRUEBA)
 same => n,Hangup()

[zynervoxv2-pruebas-cierre]
exten => s,1,GotoIf($["${ZV2_KEY}" = ""]?sinclave)
 same => n,Set(ZV2_ANSWERED=${DB(zv2c/${ZV2_KEY}/ANSWERED)})
 same => n,Set(ZV2_AMD_STATUS=${DB(zv2c/${ZV2_KEY}/AMD_STATUS)})
 same => n,Set(ZV2_AMD_CAUSE=${DB(zv2c/${ZV2_KEY}/AMD_CAUSE)})
 same => n,Set(ZV2_XFER_SIP=${DB(zv2c/${ZV2_KEY}/XFER_SIP)})
 same => n,Set(ZV2_XFER_Q850=${DB(zv2c/${ZV2_KEY}/XFER_Q850)})
 same => n,Set(ZV2_XFER_STATUS=${DB(zv2c/${ZV2_KEY}/XFER_STATUS)})
 same => n,Set(ZV2_XFER_ANSWERED=${DB(zv2c/${ZV2_KEY}/XFER_ANSWERED)})
 same => n,Set(ZV2_AMD_MS=${DB(zv2c/${ZV2_KEY}/AMD_MS)})
 same => n,Set(ZV2_REC_PATH=${DB(zv2c/${ZV2_KEY}/REC_PATH)})
 same => n,Set(ZV2_REC_C_PATH=${DB(zv2c/${ZV2_KEY}/REC_C_PATH)})
 same => n,Set(ZV2_STAGE_DB=${DB(zv2c/${ZV2_KEY}/STAGE)})
 same => n,ExecIf($["${ZV2_STAGE_DB}" != ""]?Set(ZV2_STAGE=${ZV2_STAGE_DB}))
 same => n,DBdeltree(zv2c/${ZV2_KEY})
 same => n,GotoIf($["${ZV2_ANSWERED}" != "1"]?sinclave)
 same => n,Set(ZV2_AUDIO_MS=0)
 same => n,ExecIf($["${STAT(e,${ZV2_REC_C_PATH})}" != "1"]?Set(ZV2_REC_C_PATH=))
 same => n,ExecIf($["${STAT(e,${ZV2_REC_PATH})}" != "1"]?Set(ZV2_REC_PATH=))
 same => n,Set(ZV2_SZ=${STAT(s,${ZV2_REC_PATH})})
 same => n,ExecIf($["${ZV2_REC_PATH}" != "" & "${ZV2_SZ}" > "44"]?Set(ZV2_SZ=${MATH(${ZV2_SZ}-44,int)}))
 same => n,ExecIf($["${ZV2_REC_PATH}" != "" & "${ZV2_SZ}" > "0"]?Set(ZV2_AUDIO_MS=${MATH(${ZV2_SZ}/16,int)}))
 same => n,Gosub(zynervoxv2-amd-params,s,1)
 same => n,NoOp(AUDIT_AMD ${ZV2_CALL_ID}|${ZV2_AMD_MS}|${ZV2_REC_PATH}|${ZV2_REC_C_PATH}|${ZV2_AUDIO_MS}|${ZV2_AMDP1}|${ZV2_AMDP2}|${ZV2_AMDP3}|${ZV2_AMDP4}|${ZV2_AMDP5}|${ZV2_AMDP6}|${ZV2_AMDP7}|${ZV2_AMDP8}|${ZV2_AMDP9})
 same => n(sinclave),Set(ZV2_SDIAL=${DIALSTATUS})
 same => n,ExecIf($["${ZV2_STAGE}" = "XFER"]?Set(ZV2_SDIAL=CANCEL))
 same => n,ExecIf($["${ZV2_STAGE}" = "XFER" & "${ZV2_XFER_STATUS}" != ""]?Set(ZV2_SDIAL=${ZV2_XFER_STATUS}))
 same => n,ExecIf($["${ZV2_STAGE}" = "XFER" & "${ZV2_XFER_ANSWERED}" = "1"]?Set(ZV2_SDIAL=ANSWER))
 same => n,Set(ZV2_SIP=)
 same => n,Set(ZV2_CAUSE_SRC=DIAL)
 same => n,Set(ZV2_Q850=${HANGUPCAUSE})
 same => n,Set(ZV2_SIPKEY=${HANGUPCAUSE_KEYS()})
 same => n,GotoIf($["${ZV2_SIPKEY}" = ""]?xfer)
 same => n,Set(ZV2_SIP=${HANGUPCAUSE(${ZV2_SIPKEY},tech)})
 same => n,GotoIf($["${DIALSTATUS}" != "NOANSWER" | "${ZV2_SIP:0:5}" != "SIP 1"]?xfer)
 same => n,Set(ZV2_SIP=SIP 487 Request Terminated)
 same => n(xfer),GotoIf($["${ZV2_XFER_SIP}" = ""]?fin)
 same => n,Set(ZV2_SIP=${ZV2_XFER_SIP})
 same => n,Set(ZV2_Q850=${ZV2_XFER_Q850})
 same => n,Set(ZV2_CAUSE_SRC=XFER)
 same => n(fin),AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,finish,${ZV2_CALL_ID},${ZV2_SDIAL},${ZV2_AMD_STATUS},${ZV2_AMD_CAUSE},${ZV2_Q850},${ZV2_ANSWERED},${ZV2_SIP},${ZV2_STAGE},${ZV2_CAUSE_SRC})
 same => n,GotoIf($["${ZV2_ANSWERED}" != "1" | "${STAT(f,/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php)}" != "1"]?fuera)
 same => n,GotoIf($["${ZV2_AMD_MS}" = ""]?sinamd)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,audit,${ZV2_CALL_ID},${ZV2_AMD_MS},${ZV2_REC_PATH},${ZV2_AUDIO_MS},${ZV2_AMDP1},${ZV2_AMDP2},${ZV2_AMDP3},${ZV2_AMDP4},${ZV2_AMDP5},${ZV2_AMDP6},${ZV2_AMDP7},${ZV2_AMDP8},${ZV2_AMDP9},${ZV2_REC_C_PATH})
 same => n,Goto(fuera)
 same => n(sinamd),AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,audit,${ZV2_CALL_ID},,${ZV2_REC_PATH},${ZV2_AUDIO_MS},,,,,,,,,,${ZV2_REC_C_PATH})
 same => n(fuera),Return()

[zynervoxv2-xfer-contestada]
exten => s,1,Set(DB(zv2c/${ZV2_KEY}/XFER_ANSWERED)=1)
 same => n,Return()

[zynervoxv2-amd-params]
; Valores efectivos de AMD(): la variable __ZV2_AMD_<NOMBRE> del motor si es solo dígitos; si falta o es inválida, el valor actual (amd.conf no se toca).
exten => s,1,NoOp(parametros AMD)
 same => n,ExecIf($["${ZV2_AMD_INITIAL_SILENCE}" = "" | "${FILTER(0-9,${ZV2_AMD_INITIAL_SILENCE})}" != "${ZV2_AMD_INITIAL_SILENCE}"]?Set(ZV2_AMDP1=4000):Set(ZV2_AMDP1=${ZV2_AMD_INITIAL_SILENCE}))
 same => n,ExecIf($["${ZV2_AMD_GREETING}" = "" | "${FILTER(0-9,${ZV2_AMD_GREETING})}" != "${ZV2_AMD_GREETING}"]?Set(ZV2_AMDP2=2500):Set(ZV2_AMDP2=${ZV2_AMD_GREETING}))
 same => n,ExecIf($["${ZV2_AMD_AFTER_GREETING}" = "" | "${FILTER(0-9,${ZV2_AMD_AFTER_GREETING})}" != "${ZV2_AMD_AFTER_GREETING}"]?Set(ZV2_AMDP3=800):Set(ZV2_AMDP3=${ZV2_AMD_AFTER_GREETING}))
 same => n,ExecIf($["${ZV2_AMD_TOTAL_TIME}" = "" | "${FILTER(0-9,${ZV2_AMD_TOTAL_TIME})}" != "${ZV2_AMD_TOTAL_TIME}"]?Set(ZV2_AMDP4=8000):Set(ZV2_AMDP4=${ZV2_AMD_TOTAL_TIME}))
 same => n,ExecIf($["${ZV2_AMD_MIN_WORD}" = "" | "${FILTER(0-9,${ZV2_AMD_MIN_WORD})}" != "${ZV2_AMD_MIN_WORD}"]?Set(ZV2_AMDP5=100):Set(ZV2_AMDP5=${ZV2_AMD_MIN_WORD}))
 same => n,ExecIf($["${ZV2_AMD_BETWEEN_WORDS}" = "" | "${FILTER(0-9,${ZV2_AMD_BETWEEN_WORDS})}" != "${ZV2_AMD_BETWEEN_WORDS}"]?Set(ZV2_AMDP6=50):Set(ZV2_AMDP6=${ZV2_AMD_BETWEEN_WORDS}))
 same => n,ExecIf($["${ZV2_AMD_MAX_WORDS}" = "" | "${FILTER(0-9,${ZV2_AMD_MAX_WORDS})}" != "${ZV2_AMD_MAX_WORDS}"]?Set(ZV2_AMDP7=4):Set(ZV2_AMDP7=${ZV2_AMD_MAX_WORDS}))
 same => n,ExecIf($["${ZV2_AMD_SILENCE_THRESHOLD}" = "" | "${FILTER(0-9,${ZV2_AMD_SILENCE_THRESHOLD})}" != "${ZV2_AMD_SILENCE_THRESHOLD}"]?Set(ZV2_AMDP8=256):Set(ZV2_AMDP8=${ZV2_AMD_SILENCE_THRESHOLD}))
 same => n,ExecIf($["${ZV2_AMD_MAX_WORD_LENGTH}" = "" | "${FILTER(0-9,${ZV2_AMD_MAX_WORD_LENGTH})}" != "${ZV2_AMD_MAX_WORD_LENGTH}"]?Set(ZV2_AMDP9=5000):Set(ZV2_AMDP9=${ZV2_AMD_MAX_WORD_LENGTH}))
 same => n,Return()
