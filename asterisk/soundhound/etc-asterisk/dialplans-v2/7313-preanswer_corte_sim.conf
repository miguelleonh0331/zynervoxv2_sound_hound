exten => _7313X.,1,NoOp(preanswer_corte)
 same => n,Set(__ZV2_PHONE=${EXTEN:4})
 same => n,Set(AGISIGHUP=no)
 same => n,GotoIf($["${ZV2_BLACKLIST}" != "SI"]?bl_libre)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,check,${ZV2_PHONE},${ZV2_CAMPAIGN_ID})
 same => n,GotoIf($["${ZV2_BLOQ}" = "NO"]?bl_libre)
 same => n,GotoIf($["${ZV2_BLOQ}" = "SI"]?bl_si)
 same => n,Log(WARNING,LISTA_NEGRA consulta fallida (ZV2_BLOQ=${ZV2_BLOQ}): no se llama id=${ZV2_CALL_ID})
 same => n,GotoIf($["${ZV2_CALL_ID}" = ""]?bl_fin)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,finish,${ZV2_CALL_ID},CHANUNAVAIL,,,,,,BLOQUEO_ERROR,DIAL)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,blocked,${ZV2_CALL_ID},ERROR)
 same => n,Goto(bl_fin)
 same => n(bl_si),Log(NOTICE,LISTA_NEGRA bloqueado id=${ZV2_CALL_ID})
 same => n,GotoIf($["${ZV2_CALL_ID}" = ""]?bl_fin)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/bot_ivr/call_tracking_agi.php,finish,${ZV2_CALL_ID},,,,,,,BLOQUEADO,DIAL)
 same => n,AGI(/srv/www/htdocs/zynervoxv2/marcador/amd_audit_agi.php,blocked,${ZV2_CALL_ID})
 same => n(bl_fin),Hangup()
 same => n(bl_libre),NoOp(lista negra: libre)
 same => n,ExecIf($["${ZV2_CALL_ID}" = ""]?Set(ZV2_RND=${RAND(1000,9999)}))
 same => n,ExecIf($["${ZV2_CALL_ID}" = ""]?Set(__ZV2_CALL_ID=pc-${STRFTIME(,UTC,%s)}-${ZV2_RND}))
 same => n,Set(__ZV2_KEY=${FILTER(0-9A-Za-z._-,${ZV2_CALL_ID})})
 same => n,Set(CHANNEL(hangup_handler_push)=zynervoxv2-pc-cierre,s,1)
 same => n,Set(DB(zv2c/${ZV2_KEY}/T0)=${STRFTIME(,UTC,%s%3q)})
 same => n,ExecIf($["${ZV2_DIAL_TIMEOUT}" = ""]?Set(ZV2_DIAL_TIMEOUT=40))
 same => n,Dial(SIP/troncal_sim/${ZV2_PHONE},${ZV2_DIAL_TIMEOUT},b(zynervoxv2-pc-saliente^s^1)U(zynervoxv2-pc-contestada))
 same => n,Hangup()

[zynervoxv2-pc-saliente]
; Canal SIP saliente, antes del INVITE: (1) envía en tiempo real el audio del proveedor al puente de zypad por AudioSocket (ChanSpy sobre este canal, solo lo que se recibe)
; y (2) archiva ese mismo audio en un G.711 crudo. Si el puente no está, la llamada sigue igual. El UUID lleva la marca c07e (corte permitido) y los 8 últimos dígitos del nombre del canal SIP;
; zypadmap/<uuid> guarda el nombre del canal mientras NO haya answer: el cortador solo cuelga si lo encuentra así.
exten => s,1,Set(DB(zv2c/${ZV2_KEY}/SIPCHAN)=${CHANNEL})
 same => n,Set(DB(zv2c/${ZV2_KEY}/SIPCID)=${SIPCALLID})
 same => n,Set(ZV2_UU=${MD5(${ZV2_KEY})})
 same => n,Set(ZV2_UUID=${ZV2_UU:0:8}-${ZV2_UU:8:4}-${ZV2_UU:12:4}-c07e-${ZV2_UU:16:4}${CHANNEL:-8})
 same => n,Set(DB(zv2c/${ZV2_KEY}/UUID)=${ZV2_UUID})
 same => n,Set(DB(zypadmap/${ZV2_UUID})=${CHANNEL})
 same => n,Originate(AudioSocket/127.0.0.1:8765/${ZV2_UUID},app,ChanSpy,${CHANNEL}\,qo)
 same => n,Set(DB(zv2c/${ZV2_KEY}/SPY_STATUS)=${ORIGINATE_STATUS})
 same => n,TryExec(MixMonitor(/var/lib/zynervoxv2/asterisk/recordings/marcador/${ZV2_KEY}.preanswer.ulaw))
 same => n,Set(DB(zv2c/${ZV2_KEY}/T_SAL)=${STRFTIME(,UTC,%s%3q)})
 same => n,Return()

[zynervoxv2-pc-contestada]
; Canal SIP al llegar el 200 OK: corta la captura pre-answer, graba el audio contestado y corre el AMD con los valores globales; cuelga con el resultado.
exten => s,1,Set(AGISIGHUP=no)
 same => n,Set(DB(zypadmap/${DB(zv2c/${ZV2_KEY}/UUID)})=CONTESTADA)
 same => n,StopMixMonitor()
 same => n,SoftHangup(AudioSocket/127.0.0.1:8765-${DB(zv2c/${ZV2_KEY}/UUID)})
 same => n,Set(DB(zv2c/${ZV2_KEY}/T_ANS)=${STRFTIME(,UTC,%s%3q)})
 same => n,Set(ZV2_REC_C=/var/lib/zynervoxv2/asterisk/recordings/marcador/${ZV2_KEY}.contacto.wav)
 same => n,TryExec(MixMonitor(/var/lib/zynervoxv2/asterisk/recordings/marcador/${ZV2_KEY}.wav,r(${ZV2_REC_C})))
 same => n,Gosub(zynervoxv2-amd-params,s,1)
 same => n,Set(ZV2_T1=${STRFTIME(,UTC,%s%3q)})
 same => n,AMD(${ZV2_AMDP1},${ZV2_AMDP2},${ZV2_AMDP3},${ZV2_AMDP4},${ZV2_AMDP5},${ZV2_AMDP6},${ZV2_AMDP7},${ZV2_AMDP8},${ZV2_AMDP9})
 same => n,Set(ZV2_T2=${STRFTIME(,UTC,%s%3q)})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_MS)=${MATH(${ZV2_T2}-${ZV2_T1},int)})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_STATUS)=${AMDSTATUS})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_CAUSE)=${CUT(AMDCAUSE,-,1)})
 same => n,Set(DB(zv2c/${ZV2_KEY}/AMD_RAW)=${AMDCAUSE})
 same => n,Hangup()

[zynervoxv2-pc-cierre]
; NOTA de horas: STRFTIME(,UTC,%s) de este Asterisk devuelve la época desplazada +5 h (mktime en hora local), y zynervoxv2-pa-hora ya resta esas 5 h; por eso las épocas EXTERNAS (palabra, orden de corte: época real en ms) se suman 18 000 000 ms antes de usarlas.
; Hangup handler del canal Local: una línea de registro por llamada (hora de Lima) en /var/lib/zynervoxv2/asterisk/recordings/marcador/<id>.preanswer.log. Nunca falla la llamada.
exten => s,1,GotoIf($["${ZV2_KEY}" = ""]?fuera)
 same => n,Set(ZV2_FIN=${STRFTIME(,UTC,%s%3q)})
 same => n,Set(ZV2_T0=${DB(zv2c/${ZV2_KEY}/T0)})
 same => n,Set(ZV2_TS=${DB(zv2c/${ZV2_KEY}/T_SAL)})
 same => n,Set(ZV2_TA=${DB(zv2c/${ZV2_KEY}/T_ANS)})
 same => n,Set(ZV2_AMDST=${DB(zv2c/${ZV2_KEY}/AMD_STATUS)})
 same => n,Set(ZV2_AMDCA=${DB(zv2c/${ZV2_KEY}/AMD_CAUSE)})
 same => n,Set(ZV2_AMDMS=${DB(zv2c/${ZV2_KEY}/AMD_MS)})
 same => n,Set(ZV2_SCH=${DB(zv2c/${ZV2_KEY}/SIPCHAN)})
 same => n,Set(ZV2_SCID=${DB(zv2c/${ZV2_KEY}/SIPCID)})
 same => n,Set(ZV2_UUIDF=${DB(zv2c/${ZV2_KEY}/UUID)})
 same => n,Set(ZV2_SPYST=${DB(zv2c/${ZV2_KEY}/SPY_STATUS)})
 same => n,TryExec(SoftHangup(AudioSocket/127.0.0.1:8765-${ZV2_UUIDF}))
 same => n,Set(ZV2_CUT=${DB(zypadcut/${ZV2_UUIDF})})
 same => n,Set(ZV2_X=${DB_DELETE(zypadcut/${ZV2_UUIDF})})
 same => n,Set(ZV2_X=${DB_DELETE(zypadmap/${ZV2_UUIDF})})
 same => n,DBdeltree(zv2c/${ZV2_KEY})
 same => n,Set(ZV2_PAF=/var/lib/zynervoxv2/asterisk/recordings/marcador/${ZV2_KEY}.preanswer.ulaw)
 same => n,Set(ZV2_PAB=${STAT(s,${ZV2_PAF})})
 same => n,ExecIf($["${ZV2_PAB}" = ""]?Set(ZV2_PAB=0))
 same => n,Set(ZV2_PAEND=${IF($["${ZV2_TA}" != ""]?${ZV2_TA}:${ZV2_FIN})})
 same => n,Set(ZV2_PADUR=${MATH(${ZV2_PAEND}-${ZV2_T0},int)})
 same => n,Set(ZV2_PA1=)
 same => n,Set(ZV2_PABMS=${MATH(${ZV2_PAB}/8,int)})
 same => n,Set(ZV2_PA1F=${MATH(${ZV2_PAEND}-${ZV2_PABMS})})
 same => n,ExecIf($["${ZV2_PAB}" != "0"]?Set(ZV2_PA1=${CUT(ZV2_PA1F,.,1)}))
 same => n,Set(ZV2_SIP=)
 same => n,Set(ZV2_SIPKEY=${HANGUPCAUSE_KEYS()})
 same => n,GotoIf($["${ZV2_SIPKEY}" = ""]?fmt)
 same => n,Set(ZV2_SIPKEY=${CUT(ZV2_SIPKEY,\,,${FIELDQTY(ZV2_SIPKEY,\,)})})
 same => n,Set(ZV2_SIP=${HANGUPCAUSE(${ZV2_SIPKEY},tech)})
 same => n,GotoIf($["${DIALSTATUS}" != "NOANSWER" | "${ZV2_SIP:0:5}" != "SIP 1"]?fmt)
 same => n,Set(ZV2_SIP=SIP 487 Request Terminated)
 same => n(fmt),Set(ZV2_CPAL=${CUT(ZV2_CUT,\,,1)})
 same => n,Set(ZV2_CAPA=${CUT(ZV2_CUT,\,,2)})
 same => n,Set(ZV2_CORD=${CUT(ZV2_CUT,\,,3)})
 same => n,ExecIf($["${ZV2_CAPA}" != ""]?Set(ZV2_CAPAF=${MATH(${ZV2_CAPA}+18000000)}))
 same => n,ExecIf($["${ZV2_CAPA}" != ""]?Set(ZV2_CAPA=${CUT(ZV2_CAPAF,.,1)}))
 same => n,ExecIf($["${ZV2_CORD}" != ""]?Set(ZV2_CORDF=${MATH(${ZV2_CORD}+18000000)}))
 same => n,ExecIf($["${ZV2_CORD}" != ""]?Set(ZV2_CORD=${CUT(ZV2_CORDF,.,1)}))
 same => n,Set(ZV2_CORTE=NINGUNO)
 same => n,ExecIf($["${ZV2_TA}" != ""]?Set(ZV2_CORTE=AMD))
 same => n,ExecIf($["${ZV2_TA}" = "" & "${ZV2_CUT}" != ""]?Set(ZV2_CORTE=ZYPAD))
 same => n,Gosub(zynervoxv2-pa-hora,s,1(${ZV2_T0}))
 same => n,Set(ZV2_L0=${GOSUB_RETVAL})
 same => n,Gosub(zynervoxv2-pa-hora,s,1(${ZV2_TA}))
 same => n,Set(ZV2_LA=${GOSUB_RETVAL})
 same => n,Gosub(zynervoxv2-pa-hora,s,1(${ZV2_FIN}))
 same => n,Set(ZV2_LF=${GOSUB_RETVAL})
 same => n,Gosub(zynervoxv2-pa-hora,s,1(${ZV2_PA1}))
 same => n,Set(ZV2_L1=${GOSUB_RETVAL})
 same => n,Gosub(zynervoxv2-pa-hora,s,1(${ZV2_CAPA}))
 same => n,Set(ZV2_LCA=${GOSUB_RETVAL})
 same => n,Gosub(zynervoxv2-pa-hora,s,1(${ZV2_CORD}))
 same => n,Set(ZV2_LCO=${GOSUB_RETVAL})
 same => n,Set(ZV2_C1=)
 same => n,Set(ZV2_C2=)
 same => n,ExecIf($["${ZV2_CORD}" != ""]?Set(ZV2_C1F=${MATH(${ZV2_CORD}-${ZV2_CAPA})}))
 same => n,ExecIf($["${ZV2_CORD}" != ""]?Set(ZV2_C1=${CUT(ZV2_C1F,.,1)}))
 same => n,ExecIf($["${ZV2_CORD}" != ""]?Set(ZV2_C2F=${MATH(${ZV2_FIN}-${ZV2_CORD})}))
 same => n,ExecIf($["${ZV2_CORD}" != ""]?Set(ZV2_C2=${CUT(ZV2_C2F,.,1)}))
 same => n,ExecIf($["${ZV2_CORD}" != ""]?Set(ZV2_C3F=${MATH(${ZV2_PAEND}-${ZV2_CORD})}))
 same => n,ExecIf($["${ZV2_CORD}" != ""]?Set(ZV2_C3=${CUT(ZV2_C3F,.,1)}))
 same => n,Set(FILE(/var/lib/zynervoxv2/asterisk/recordings/marcador/${ZV2_KEY}.preanswer.log)=call_id=${ZV2_KEY} | corte_por=${ZV2_CORTE} | palabra=${ZV2_CPAL} | palabra_aparecio=${ZV2_LCA} | orden_corte=${ZV2_LCO} | aparicion_a_orden_ms=${ZV2_C1} | orden_a_fin_ms=${ZV2_C2} | orden_antes_del_fin_pre_ms=${ZV2_C3} | inicio=${ZV2_L0} | primer_audio_preanswer=${ZV2_L1} | audio_preanswer=${IF($["${ZV2_PAB}" != "0"]?SI:NO)} | bytes_preanswer=${ZV2_PAB} | answer=${ZV2_LA} | fin=${ZV2_LF} | duracion_preanswer_ms=${ZV2_PADUR} | sip_final=${ZV2_SIP} | dialstatus=${DIALSTATUS} | amdstatus=${ZV2_AMDST} | amdcause=${ZV2_AMDCA} | amd_ms=${ZV2_AMDMS} | canal_sip=${ZV2_SCH} | sip_call_id=${ZV2_SCID} | call_id_zypad=${ZV2_UUIDF} | puente=${ZV2_SPYST}${URIDECODE(%0A)})
 same => n(fuera),Return()

[zynervoxv2-pa-hora]
; Milisegundos de época (ARG1) -> hora de Lima (UTC-5, sin horario de verano) "AAAA-MM-DD HH:MM:SS.mmm". El STRFTIME de este Asterisk no resuelve zonas por nombre, por eso se resta a mano.
exten => s,1,GotoIf($["${ARG1}" = ""]?vacio)
 same => n,Return(${STRFTIME(${MATH(${ARG1:0:-3}-18000,int)},,%F %T)}.${ARG1:-3})
 same => n(vacio),Return()

[zynervoxv2-amd-params]
; Valores efectivos de AMD(): la variable __ZV2_AMD_<NOMBRE> del motor si es solo dígitos; si falta o es inválida, el valor actual (amd.conf no se toca).
exten => s,1,NoOp(parametros AMD)
 same => n,ExecIf($["${ZV2_AMD_INITIAL_SILENCE}" = "" | "${FILTER(0-9,${ZV2_AMD_INITIAL_SILENCE})}" != "${ZV2_AMD_INITIAL_SILENCE}"]?Set(ZV2_AMDP1=4000):Set(ZV2_AMDP1=${ZV2_AMD_INITIAL_SILENCE}))
 same => n,ExecIf($["${ZV2_AMD_GREETING}" = "" | "${FILTER(0-9,${ZV2_AMD_GREETING})}" != "${ZV2_AMD_GREETING}"]?Set(ZV2_AMDP2=2500):Set(ZV2_AMDP2=${ZV2_AMD_GREETING}))
 same => n,ExecIf($["${ZV2_AMD_AFTER_GREETING}" = "" | "${FILTER(0-9,${ZV2_AMD_AFTER_GREETING})}" != "${ZV2_AMD_AFTER_GREETING}"]?Set(ZV2_AMDP3=800):Set(ZV2_AMDP3=${ZV2_AMD_AFTER_GREETING}))
 same => n,ExecIf($["${ZV2_AMD_TOTAL_TIME}" = "" | "${FILTER(0-9,${ZV2_AMD_TOTAL_TIME})}" != "${ZV2_AMD_TOTAL_TIME}"]?Set(ZV2_AMDP4=8000):Set(ZV2_AMDP4=${ZV2_AMD_TOTAL_TIME}))
 same => n,ExecIf($["${ZV2_AMD_MIN_WORD}" = "" | "${FILTER(0-9,${ZV2_AMD_MIN_WORD})}" != "${ZV2_AMD_MIN_WORD}"]?Set(ZV2_AMDP5=100):Set(ZV2_AMDP5=${ZV2_AMD_MIN_WORD}))
 same => n,ExecIf($["${ZV2_AMD_BETWEEN_WORDS}" = "" | "${FILTER(0-9,${ZV2_AMD_BETWEEN_WORDS})}" != "${ZV2_AMD_BETWEEN_WORDS}"]?Set(ZV2_AMDP6=50):Set(ZV2_AMDP6=${ZV2_AMD_BETWEEN_WORDS}))
 same => n,ExecIf($["${ZV2_AMD_MAX_WORDS}" = "" | "${FILTER(0-9,${ZV2_AMD_MAX_WORDS})}" != "${ZV2_AMD_MAX_WORDS}"]?Set(ZV2_AMDP7=4):Set(ZV2_AMDP7=${ZV2_AMD_MAX_WORDS}))
 same => n,ExecIf($["${ZV2_AMD_SILENCE_THRESHOLD}" = "" | "${FILTER(0-9,${ZV2_AMD_SILENCE_THRESHOLD})}" != "${ZV2_AMD_SILENCE_THRESHOLD}"]?Set(ZV2_AMDP8=256):Set(ZV2_AMDP8=${ZV2_AMD_SILENCE_THRESHOLD}))
 same => n,ExecIf($["${ZV2_AMD_MAX_WORD_LENGTH}" = "" | "${FILTER(0-9,${ZV2_AMD_MAX_WORD_LENGTH})}" != "${ZV2_AMD_MAX_WORD_LENGTH}"]?Set(ZV2_AMDP9=5000):Set(ZV2_AMDP9=${ZV2_AMD_MAX_WORD_LENGTH}))
 same => n,Return()
